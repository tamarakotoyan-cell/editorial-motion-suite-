name: ci

# Every check here already existed and was run by hand. This makes them a gate.
# All of them are stdlib-only Python, so there is nothing to install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build validates — every cited path resolves inside its own skill
        run: python3 build-skills.py --check

      # The manifest version is what artifacts get stamped with and what eval
      # results are attributed to. A release the changelog says nothing about
      # is a release nobody can reason about six months later.
      - name: Manifest version matches the newest changelog entry
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          plugin = Path("plugins/editorial-motion")
          version = json.loads(
              (plugin / ".claude-plugin/plugin.json").read_text(encoding="utf-8")
          )["version"]
          headings = re.findall(
              r"^## +(\d+\.\d+\.\d+)\b",
              (plugin / "CHANGELOG.md").read_text(encoding="utf-8"), re.M)

          if not headings:
              sys.exit("::error::CHANGELOG.md has no '## X.Y.Z' heading")
          if headings[0] != version:
              sys.exit(f"::error::plugin.json is {version} but the newest "
                       f"CHANGELOG entry is {headings[0]}")
          print(f"version {version} agrees with the changelog")
          PY

      # motion.css owns the house curve set. check-artifact.py keeps a second
      # copy because it has to lint artifacts with no plugin around it — the one
      # duplication the ownership table allows, on condition it cannot drift.
      - name: Linter's curve set still matches motion.css
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          skills = Path("plugins/editorial-motion/skills")
          css = (skills / "motion-system/assets/motion.css").read_text(encoding="utf-8")
          linter = (skills / "analog-surface/assets/check-artifact.py").read_text(encoding="utf-8")

          bezier = re.compile(r"cubic-bezier\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*,"
                              r"\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)")
          in_css = {tuple(round(float(g), 2) for g in m.groups())
                    for m in bezier.finditer(css)}

          block = re.search(r"HOUSE_CURVES\s*=\s*\{(.*?)\}", linter, re.S)
          if not block:
              sys.exit("::error::could not find HOUSE_CURVES in check-artifact.py")
          in_linter = {tuple(round(float(v), 2) for v in row)
                       for row in re.findall(r"\(([^)]*)\)", block.group(1))
                       for row in [row.split(",")] if len(row) == 4}

          missing = in_css - in_linter
          if missing:
              sys.exit(f"::error::motion.css defines {sorted(missing)}, which "
                       f"HOUSE_CURVES does not accept")
          print(f"{len(in_css)} curves in motion.css, all accepted by the "
                f"linter's {len(in_linter)}")
          PY

      - name: Linter self-test — every check still fires
        run: |
          python3 plugins/editorial-motion/skills/analog-surface/assets/check-artifact.py \
            --self-test

      # The briefs themselves cost tokens and minutes, so a real run belongs in
      # the version-bump process, run by a person. What CI can do for free is
      # keep the set honest: every skill a brief names still exists, and no
      # brief has quietly stopped expecting the router.
      - name: Eval set is well-formed
        run: python3 evals/run-evals.py --dry-run

      - name: Tile regression — seam continuity false-positives
        run: |
          python3 plugins/editorial-motion/skills/analog-surface/assets/check-tile-regression.py

      # The examples are the system's own worked demonstrations. If they break the
      # house rules, either the rules are wrong or the examples are.
      # Errors fail the build; warnings are printed but tolerated. editorial-explainer's
      # example currently carries 4 analog-surface warnings — see issue before
      # promoting this step to --strict.
      - name: Shipped examples pass the house rules
        run: |
          LINTER=plugins/editorial-motion/skills/analog-surface/assets/check-artifact.py
          find plugins -name 'example.html' -print0 \
            | xargs -0 -r python3 "$LINTER"

      - name: Build output is free of caches and Finder droppings
        run: |
          python3 build-skills.py
          if find ../editorial-motion-dist \
               \( -name '__pycache__' -o -name '*.pyc' -o -name '.DS_Store' \) \
               -print -quit | grep -q .; then
            echo "::error::build output contains caches or Finder droppings"
            exit 1
          fi
          echo "build output clean"
